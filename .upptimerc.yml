# Pagina de status do ORION SGI - https://statusmaxpesa.orionsgi.com.br
# Testes a cada 5 minutos pelo GitHub Actions (fora do servidor do ORION).
# Documentacao: https://upptime.js.org/docs/configuration
owner: Projetos-brs
repo: status-orion

# Servicos em ordem alfabetica
sites:
  - name: MAXPESA · API e banco de dados
    url: https://maxpesa.orionsgi.com.br/api/public/saude
    expectedStatusCodes:
      - 200
    maxResponseTime: 10000
  - name: MAXPESA · Sistema
    url: https://maxpesa.orionsgi.com.br/
    maxResponseTime: 10000
  - name: MAXPESA · Trabalhe Conosco
    url: https://maxpesa.orionsgi.com.br/carreiras/maxpesa
    maxResponseTime: 10000

status-website:
  cname: statusmaxpesa.orionsgi.com.br
  logoUrl: https://raw.githubusercontent.com/Projetos-brs/status-orion/master/assets/orion-logo.png
  name: Status ÓRION SGI
  theme: night
  introTitle: "Status dos sistemas **ÓRION SGI**"
  introMessage: Acompanhe aqui, em tempo real, a disponibilidade dos sistemas ÓRION SGI. Os serviços são testados automaticamente a cada 5 minutos, de fora dos nossos servidores. Em caso de instabilidade, a ocorrência e as atualizações aparecem nesta página.
  navbar:
    - title: Status
      href: /

